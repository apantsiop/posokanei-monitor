services:
  posokanei:
    # Pulls the published multi-arch image from GHCR (no local build needed).
    # To build from source instead, uncomment `build: .` below.
    image: ghcr.io/apantsiop/posokanei-monitor:latest
    # build: .
    container_name: posokanei-monitor
    pull_policy: always
    ports:
      - "8000:8000"
    # Bind-mount the data dir so the catalogue, snapshots, reports and SQLite
    # DB persist on the host and any data you've already scraped is reused.
    # Swap for a named volume if you prefer Docker-managed storage.
    volumes:
      - ./posokanei_data:/app/posokanei_data
    environment:
      - TZ=Europe/Athens
      - PORT=8000
    restart: unless-stopped
